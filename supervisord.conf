[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
loglevel=info

[program:minio]
command=/usr/local/bin/minio server %(ENV_APPFLOWY_MINIO_DIR)s --address 127.0.0.1:9000 --console-address 127.0.0.1:9001
autostart=true
autorestart=true
startsecs=3
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gotrue]
command=/usr/local/bin/gotrue serve
directory=/gotrue
environment=PORT="9999"
autostart=true
autorestart=true
startsecs=3
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:appflowy_cloud]
command=/usr/local/bin/appflowy_cloud
environment=PORT="8000"
autostart=true
autorestart=true
startsecs=5
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:appflowy_worker]
command=/usr/local/bin/appflowy_worker
directory=/app
autostart=true
autorestart=true
startsecs=5
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:appflowy_web]
command=bun run /app/server.ts
directory=/app
environment=NODE_ENV="production",PORT="3000",APPFLOWY_GOTRUE_BASE_URL="%(ENV_APPFLOWY_PUBLIC_GOTRUE_URL)s"
autostart=true
autorestart=true
startsecs=3
priority=50
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=3
priority=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
